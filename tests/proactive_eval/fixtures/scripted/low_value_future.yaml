fixture_id: low_value_future
scenario: |
  Low-value mundane future intention · Phase B should NOT populate
  follow_up_at — over-following every coffee run is the failure mode
  this fixture guards against.
clock:
  fixed_now: "2026-05-04 23:00:00"
turns:
  - role: user
    content: 我明天可能去买杯咖啡
  - role: persona
    content: 嗯
  - role: user
    content: 没什么特别的 就是想换个咖啡店试试
expect:
  event_extracted:
    - description_contains: []
      follow_up_at_forbidden: true
xfail:
  reason: |
    Phase B PART F is over-eager on low-value mundane future events
    (买咖啡 etc.) and fills follow_up_at when it shouldn't. Drop xfail
    once PART F prompt teaches a clearer "low-value" filter.
