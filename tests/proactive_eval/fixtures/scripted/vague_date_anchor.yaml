fixture_id: vague_date_anchor
scenario: |
  Date is concrete ("下周一") but no specific clock time given · LLM
  should pick a reasonable default time of day (mid-morning for 入职)
  and populate follow_up_at + advance_pre/post.
clock:
  fixed_now: "2026-05-04 23:00:00"
turns:
  - role: user
    content: 我下周一要入职新公司
  - role: persona
    content: 恭喜 第一天紧不紧张
  - role: user
    content: 有点 但是挺期待的
expect:
  event_extracted:
    - description_contains: [入职]
      follow_up_at_required: true
      event_time_required: true
      advance_pre_hours_range: [4, 48]
      advance_post_hours_range: [2, 48]
      follow_up_hint_min_chars: 3
  phases:
    pre:
      fire_at_clock: "2026-05-10 18:00:00"
      audit_action: fire
      judge_message_prompts:
        - Does the message acknowledge the user is starting their new job tomorrow?
    post:
      fire_at_clock: "2026-05-11 20:00:00"
      audit_action: fire
      judge_message_prompts:
        - Does the message ask about the user's first day at the new job?
